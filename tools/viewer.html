<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oBirdy Replay Theater</title>
<style>
:root{
  --bg:#0b0e14; --panel:#131722; --panel2:#0f131c; --line:#232a3a;
  --text:#e6e9ef; --muted:#8b93a7; --dim:#5d6578;
  --red:#e0524f; --red-deep:#43171b; --red-edge:#8d3230;
  --blue:#4a86e8; --blue-deep:#152a4d; --blue-edge:#2d5699;
  --civ:#b39b6d; --civ-deep:#2c2718; --civ-edge:#6d5f3d;
  --ass:#05060a; --ass-edge:#6a6f7d;
  --gold:#f4c15d;
  --tile:#1c2231; --tile-edge:#2b3448;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:radial-gradient(1200px 600px at 50% -10%,#182034 0%,var(--bg) 60%);
  color:var(--text);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;min-height:100%}
header.top{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#151b28,#0f131c);
}
.brand{font-weight:700;letter-spacing:.5px;font-size:15px;white-space:nowrap}
.brand .dot{color:var(--gold)}
.brand small{display:block;font-weight:400;font-size:10px;color:var(--dim);letter-spacing:1.4px;text-transform:uppercase}
.top .spacer{flex:1}
.pill{
  border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:4px 11px;font-size:12px;color:var(--muted);white-space:nowrap;
}
.pill b{color:var(--text);font-weight:600}
.toggle{
  border:1px solid var(--line);background:var(--panel);border-radius:8px;
  padding:6px 11px;font-size:12.5px;color:var(--muted);
}
.toggle:hover{border-color:#39455e;color:var(--text)}
.toggle[aria-pressed="true"]{background:#2a2413;border-color:var(--gold);color:var(--gold)}

.layout{display:flex;flex:1;min-height:0;align-items:stretch}

/* ---------- sidebar ---------- */
aside{
  width:264px;flex:0 0 264px;border-right:1px solid var(--line);
  background:var(--panel2);display:flex;flex-direction:column;min-height:0;
}
.side-head{
  padding:10px 12px 8px;border-bottom:1px solid var(--line);
  font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);
  display:flex;align-items:center;gap:8px;
}
.side-head .count{margin-left:auto;color:var(--muted);letter-spacing:0}
#gamelist{overflow-y:auto;flex:1;padding:6px;min-height:0}
.gcard{
  display:block;width:100%;text-align:left;border:1px solid transparent;
  background:transparent;border-radius:var(--radius);padding:8px 10px;margin-bottom:3px;
}
.gcard:hover{background:#161c29;border-color:var(--line)}
.gcard[aria-current="true"]{background:#1b2334;border-color:#3d4b68}
.gcard .lab{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.gcard .lab .badge{
  margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.6px;
  border-radius:4px;padding:1px 5px;border:1px solid;
}
.badge.win-R{color:var(--red);border-color:var(--red-edge);background:#2a1214}
.badge.win-B{color:var(--blue);border-color:var(--blue-edge);background:#101f38}
.badge.death{color:#fff;border-color:var(--ass-edge);background:#000}
.gcard .sub{font-size:11px;color:var(--muted);margin-top:2px}
.gcard .meta{font-size:10.5px;color:var(--dim);margin-top:3px}
.dropzone{
  margin:8px;padding:12px 10px;border:1px dashed #333d52;border-radius:var(--radius);
  text-align:center;font-size:11.5px;color:var(--dim);
}
.dropzone b{color:var(--muted);display:block;margin-bottom:3px;font-size:12px}
.dropzone label{color:var(--gold);text-decoration:underline;cursor:pointer}
.dropzone input{display:none}
body.dragging .dropzone{border-color:var(--gold);color:var(--gold);background:#1d1a10}

/* ---------- main ---------- */
main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;padding:14px 16px 18px;gap:11px}
main > *{width:100%;max-width:860px}

.cluebar{
  border:1px solid var(--line);border-radius:12px;background:var(--panel);
  padding:11px 14px;display:flex;align-items:center;gap:14px;min-height:62px;
  position:relative;overflow:hidden;
}
.cluebar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dim)}
.cluebar.team-R::before{background:var(--red)}
.cluebar.team-B::before{background:var(--blue)}
.cluebar .who{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.cluebar.team-R .who{color:var(--red)}
.cluebar.team-B .who{color:var(--blue)}
.cluebar .word{
  font-size:clamp(20px,3.4vw,30px);font-weight:800;letter-spacing:2px;line-height:1.1;
  overflow-wrap:anywhere;
}
.cluebar .num{
  font-size:13px;font-weight:800;border:2px solid currentColor;border-radius:8px;
  min-width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;
  flex:0 0 auto;
}
.cluebar .num[hidden]{display:none}
.cluebar.team-R .num{color:var(--red)} .cluebar.team-B .num{color:var(--blue)}
.cluebar .think{margin-left:auto;font-size:11px;color:var(--dim);text-align:right;white-space:nowrap}

/* ---------- board ---------- */
.boardwrap{position:relative}
#board{
  display:grid;grid-template-columns:repeat(5,1fr);gap:7px;
}
.tile{
  position:relative;aspect-ratio:1.85/1;min-height:48px;border-radius:var(--radius);
  border:1px solid var(--tile-edge);background:linear-gradient(180deg,#212838,#1a2030);
  display:flex;align-items:center;justify-content:center;padding:4px;
  text-align:center;font-weight:700;letter-spacing:.6px;
  font-size:clamp(9px,1.2vw,13px);text-transform:uppercase;
  transition:transform .18s ease,box-shadow .18s ease,background .3s ease,border-color .3s ease,color .3s ease;
  overflow-wrap:anywhere;color:#dfe4ee;
}
.tile .w{position:relative;z-index:2;line-height:1.15}
.tile .key-dot{
  position:absolute;left:5px;top:5px;width:7px;height:7px;border-radius:50%;
  opacity:0;transition:opacity .2s ease;z-index:3;
}
body.spy .tile .key-dot{opacity:.95}
.key-R{background:var(--red)} .key-B{background:var(--blue)}
.key-C{background:var(--civ)} .key-A{background:#fff;box-shadow:0 0 0 2px #000}

body.spy .tile.hidden.k-R{background:linear-gradient(180deg,#3a1a1d,#2a1216);border-color:var(--red-edge)}
body.spy .tile.hidden.k-B{background:linear-gradient(180deg,#16294d,#101d38);border-color:var(--blue-edge)}
body.spy .tile.hidden.k-C{background:linear-gradient(180deg,#2c2718,#221e12);border-color:var(--civ-edge)}
body.spy .tile.hidden.k-A{background:repeating-linear-gradient(45deg,#0a0a0c,#0a0a0c 6px,#15151a 6px,#15151a 12px);border-color:var(--ass-edge)}

.tile.done{color:#fff}
.tile.done.k-R{background:linear-gradient(180deg,var(--red),#a53a38);border-color:#f0716e}
.tile.done.k-B{background:linear-gradient(180deg,var(--blue),#2f5fae);border-color:#79a6f2}
.tile.done.k-C{background:linear-gradient(180deg,var(--civ),#8b7748);border-color:#cdb886}
.tile.done.k-A{background:linear-gradient(180deg,#0d0d12,#000);border-color:#8a90a0;color:#fff}
.tile.done .w{text-decoration:line-through;text-decoration-thickness:1px;opacity:.92}
.tile.done.k-A .w{text-decoration:none;letter-spacing:1.4px}

@keyframes flipin{
  0%{transform:rotateX(0deg) scale(1)}
  45%{transform:rotateX(88deg) scale(1.04)}
  100%{transform:rotateX(0deg) scale(1)}
}
.tile.just{animation:flipin .42s ease;z-index:4;box-shadow:0 0 0 2px var(--gold),0 6px 22px rgba(0,0,0,.55)}

/* assassin drama */
#flash{
  position:fixed;inset:0;pointer-events:none;opacity:0;z-index:60;
  background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.92),rgba(190,20,20,.55) 35%,rgba(0,0,0,.96) 75%);
}
@keyframes bang{0%{opacity:0}8%{opacity:1}45%{opacity:.55}100%{opacity:0}}
body.boom #flash{animation:bang 1.15s ease forwards}
@keyframes shakeit{
  0%,100%{transform:translate(0,0)}
  15%{transform:translate(-6px,3px)} 30%{transform:translate(5px,-3px)}
  45%{transform:translate(-4px,-2px)} 60%{transform:translate(4px,2px)}
  80%{transform:translate(-2px,1px)}
}
body.boom .boardwrap{animation:shakeit .5s ease}
#boomtext{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  z-index:61;pointer-events:none;
  font-size:clamp(30px,7vw,72px);font-weight:900;letter-spacing:8px;color:#fff;
  text-shadow:0 0 26px rgba(255,60,60,.95);
}
body.boom #boomtext{display:flex}
@media (prefers-reduced-motion:reduce){
  .tile.just{animation:none}
  body.boom #flash{animation:none;opacity:.35}
  body.boom .boardwrap{animation:none}
}

/* ---------- controls ---------- */
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.controls .btn{
  border:1px solid var(--line);background:var(--panel);border-radius:9px;
  min-width:40px;height:36px;padding:0 10px;font-size:14px;color:var(--muted);
}
.controls .btn:hover:not(:disabled){border-color:#3d4b68;color:var(--text)}
.controls .btn:disabled{opacity:.35;cursor:default}
.controls .btn.play{background:var(--gold);border-color:var(--gold);color:#1b1405;font-weight:800;min-width:52px}
#scrub{flex:1;min-width:110px;accent-color:var(--gold)}
.controls .step{font-size:11.5px;color:var(--dim);white-space:nowrap}
.controls select{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:7px 8px;font-size:12.5px;color:var(--muted);
}

/* ---------- scoreboard ---------- */
.score{display:flex;gap:8px;flex-wrap:wrap}
.team{
  flex:1 1 190px;border:1px solid var(--line);border-radius:12px;background:var(--panel);
  padding:9px 12px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden;
}
.team::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.team.R::before{background:var(--red)} .team.B::before{background:var(--blue)}
.team.active{border-color:var(--gold)}
.team .nm{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700}
.team.R .nm{color:var(--red)} .team.B .nm{color:var(--blue)}
.team .agents{font-size:11px;color:var(--dim);margin-top:1px}
.team .left{margin-left:auto;text-align:right;line-height:1}
.team .left b{font-size:23px;font-weight:800;display:block}
.team .left span{font-size:9.5px;letter-spacing:1.2px;color:var(--dim);text-transform:uppercase}
.pips{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap}
.pip{width:9px;height:9px;border-radius:2px;border:1px solid}
.team.R .pip{border-color:var(--red-edge)} .team.B .pip{border-color:var(--blue-edge)}
.team.R .pip.on{background:var(--red)} .team.B .pip.on{background:var(--blue)}

/* ---------- log ---------- */
.logwrap{
  border:1px solid var(--line);border-radius:12px;background:var(--panel);
  display:flex;flex-direction:column;min-height:120px;flex:1;overflow:hidden;
}
.logwrap h3{
  margin:0;padding:8px 12px;border-bottom:1px solid var(--line);
  font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);font-weight:600;
  display:flex;gap:8px;align-items:center;
}
.logwrap h3 .note{margin-left:auto;color:var(--muted);letter-spacing:0;text-transform:none;font-size:11px;font-weight:400}
#log{overflow-y:auto;padding:4px 0;flex:1;max-height:124px;scroll-behavior:smooth}
.line{
  display:flex;gap:9px;padding:3px 12px;font-size:12.5px;color:var(--muted);
  border-left:3px solid transparent;cursor:pointer;
}
.line:hover{background:#171d2b}
.line .n{color:var(--dim);font-size:10.5px;min-width:22px;text-align:right;padding-top:2px}
.line.R{border-left-color:rgba(224,82,79,.45)}
.line.B{border-left-color:rgba(74,134,232,.45)}
.line.clue{color:var(--text);font-weight:600}
.line.good .txt{color:#7fd18f}
.line.bad .txt{color:#e8a06a}
.line.kill .txt{color:#ff6b6b;font-weight:700}
.line.now{background:#1d2434;color:var(--text)}
.line.now .txt{color:var(--text)}
.line.kill.now .txt{color:#ff6b6b}

.result{
  border:1px solid var(--line);border-radius:12px;padding:9px 13px;background:var(--panel);
  font-size:13px;display:none;
}
.result.show{display:block}
.result.R{border-color:var(--red-edge);background:#1e1214}
.result.B{border-color:var(--blue-edge);background:#101a2c}
.result b{letter-spacing:.5px}

.hint{font-size:11px;color:var(--dim);text-align:center}
.hint kbd{
  border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:0 4px;background:var(--panel);color:var(--muted);font-size:10.5px;
  font-family:ui-monospace,Menlo,monospace;
}

/* ---------- selftest ---------- */
#selftest{padding:16px;max-width:900px;margin:0 auto}
#selftest h1{font-size:18px;margin:0 0 10px}
#selftest .row{
  display:flex;gap:10px;padding:3px 0;font-size:12.5px;
  font-family:ui-monospace,Menlo,monospace;border-bottom:1px solid #1a2030;
}
#selftest .row .st{font-weight:700;min-width:46px}
#selftest .row.pass .st{color:#7fd18f} #selftest .row.fail .st{color:#ff6b6b}
#selftest .summary{margin:12px 0;padding:10px 14px;border-radius:10px;font-weight:700;font-size:15px}
#selftest .summary.pass{background:#12281a;border:1px solid #2f6b40;color:#7fd18f}
#selftest .summary.fail{background:#2a1214;border:1px solid #8d3230;color:#ff6b6b}

/* On a full window the app owns the viewport: header and game list stay put
   and only the board column scrolls.  Narrow layouts fall back to page scroll. */
@media (min-width:901px){
  html,body{overflow:hidden}
  #app{height:100vh}
  .layout{overflow:hidden}
  main{overflow-y:auto}
}

/* ---------- narrow / side-panel ---------- */
@media (max-width:900px){
  .layout{flex-direction:column}
  /* the game picker becomes a shelf of cards you swipe, not a tall column */
  aside{width:auto;flex:0 0 auto;border-right:none;border-bottom:1px solid var(--line)}
  .side-head{padding:6px 10px 5px}
  #gamelist{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:7px}
  .gcard{flex:0 0 186px;margin-bottom:0;border-color:var(--line)}
  .dropzone{margin:0 7px 7px;padding:6px 9px;font-size:11px}
  .dropzone b{display:inline;margin:0}
  .dropzone .long{display:none}
  main{padding:11px 12px 16px}
  .tile{font-size:clamp(8px,2.1vw,12px);min-height:46px}
  .cluebar .word{font-size:clamp(18px,5vw,26px)}
  #log{max-height:170px}
}
@media (max-width:560px){
  #board{gap:5px}
  .tile{min-height:40px;aspect-ratio:1.25/1}
  .team{flex:1 1 100%}
}
</style>
</head>
<body>

<div id="flash"></div>
<div id="boomtext">ASSASSIN</div>

<div id="app">
  <header class="top">
    <div class="brand">oBirdy Replay <span class="dot">Theater</span>
      <small>codenames &middot; cog 2026</small></div>
    <span class="pill" id="matchup">&mdash;</span>
    <span class="pill" id="meta">&mdash;</span>
    <span class="spacer"></span>
    <button class="toggle" id="spybtn" aria-pressed="false" title="Show the key grid (s)">Spymaster view</button>
  </header>

  <div class="layout">
    <aside>
      <div class="side-head">Games <span class="count" id="gcount"></span></div>
      <div id="gamelist"></div>
      <div class="dropzone" id="drop">
        <b>Drop a replay JSON here</b>
        <span class="long">exported by <span class="mono">harness.export_replay</span><br></span>
        or <label>browse<input type="file" id="file" accept=".json,application/json" multiple></label>
      </div>
    </aside>

    <main>
      <div class="cluebar" id="cluebar">
        <div>
          <div class="who" id="clue-who">no clue yet</div>
          <div class="word" id="clue-word">&mdash;</div>
        </div>
        <div class="num" id="clue-num" hidden></div>
        <div class="think" id="clue-think"></div>
      </div>

      <div class="boardwrap"><div id="board"></div></div>

      <div class="controls">
        <button class="btn" id="b-first" title="Start (Home)">&#124;&#9664;</button>
        <button class="btn" id="b-prev" title="Step back (&larr;)">&#9664;</button>
        <button class="btn play" id="b-play" title="Play / pause (space)">&#9654;</button>
        <button class="btn" id="b-next" title="Step forward (&rarr;)">&#9654;&#9654;</button>
        <button class="btn" id="b-last" title="End (End)">&#9654;&#124;</button>
        <input type="range" id="scrub" min="0" max="0" value="0">
        <span class="step" id="stepno">0 / 0</span>
        <select id="speed" title="Playback speed (&#91; and &#93;)">
          <option value="2">0.5&times;</option>
          <option value="1" selected>1&times;</option>
          <option value="0.5">2&times;</option>
          <option value="0.25">4&times;</option>
        </select>
      </div>

      <div class="score">
        <div class="team R" id="team-R">
          <div>
            <div class="nm">Red</div>
            <div class="agents" id="ag-R">&mdash;</div>
            <div class="pips" id="pips-R"></div>
          </div>
          <div class="left"><b id="left-R">9</b><span>left</span></div>
        </div>
        <div class="team B" id="team-B">
          <div>
            <div class="nm">Blue</div>
            <div class="agents" id="ag-B">&mdash;</div>
            <div class="pips" id="pips-B"></div>
          </div>
          <div class="left"><b id="left-B">8</b><span>left</span></div>
        </div>
      </div>

      <div class="result" id="result"></div>

      <div class="logwrap">
        <h3>Commentary <span class="note" id="gamenote"></span></h3>
        <div id="log"></div>
      </div>

      <div class="hint">
        <kbd>space</kbd> play/pause &nbsp; <kbd>&larr;</kbd><kbd>&rarr;</kbd> step &nbsp;
        <kbd>&#8679;</kbd>+<kbd>&rarr;</kbd> next turn &nbsp; <kbd>s</kbd> spymaster &nbsp;
        <kbd>r</kbd> restart &nbsp; <kbd>j</kbd><kbd>k</kbd> game &nbsp; <kbd>&#91;</kbd><kbd>&#93;</kbd> speed
      </div>
    </main>
  </div>
</div>

<div id="selftest" hidden></div>

  });
  check("friendlyAgent maps the ladder", function(){
    eq(CN.friendlyAgent("players.codemaster_heuristic.AICodemaster"), "Rattata", "heuristic");
    eq(CN.friendlyAgent("players.guesser_glove.AIGuesser"), "Abra", "glove");
    eq(CN.friendlyAgent("players.codemaster_obirdy.AICodemaster"), "oBirdy", "obirdy");
    eq(CN.friendlyAgent("players.guesser_random.AIGuesser"), "Magikarp", "random");
    eq(CN.friendlyAgent(null), "?", "null");
    return true;
  });
  check("winnerAfter follows the framework rules", function(){
    eq(CN.winnerAfter("A", {R:1,B:1,C:0,A:1}, "R"), "B", "assassin by red");
    eq(CN.winnerAfter("R", {R:9,B:0,C:0,A:0}, "B"), "R", "blue reveals red's last");
    eq(CN.winnerAfter("B", {R:0,B:7,C:0,A:0}, "B"), null, "not done yet");
    return true;
  });

  games.forEach(function(g){
    var tag = g.id || CN.gameTitle(g);
    check(tag + ": board is 25 unique words", function(){
      eq(g.words.length, 25, "words");
      var set = {}, i;
      for(i = 0; i < 25; i++){
        if(set[g.words[i]]) throw new Error("duplicate word " + g.words[i]);
        set[g.words[i]] = 1;
      }
      return true;
    });
    check(tag + ": key is 9R/8B/7C/1A", function(){
      eq(g.key.length, 25, "key length");
      var c = {R:0,B:0,C:0,A:0}, i;
      for(i = 0; i < 25; i++){
        if(!(g.key[i] in c)) throw new Error("bad key char " + g.key[i]);
        c[g.key[i]]++;
      }
      eq(c.R, 9, "red"); eq(c.B, 8, "blue"); eq(c.C, 7, "civilian"); eq(c.A, 1, "assassin");
      return true;
    });
    check(tag + ": guesses agree with words and key", function(){
      g.moves.forEach(function(m, k){
        if(m.t !== "guess") return;
        if(g.words[m.i] !== m.word)
          throw new Error("move " + k + ": index " + m.i + " is " + g.words[m.i] + ", not " + m.word);
        if(g.key[m.i] !== m.color)
          throw new Error("move " + k + ": key says " + g.key[m.i] + ", move says " + m.color);
        if(CN.indexOfWord(g, m.word) !== m.i)
          throw new Error("move " + k + ": word lookup disagrees with index");
      });
      return true;
    });
    check(tag + ": timeline length and clue count", function(){
      var frames = CN.buildTimeline(g);
      eq(frames.length, g.moves.length + 1, "frames");
      var clues = g.moves.filter(function(m){ return m.t === "clue"; }).length;
      eq(frames[frames.length - 1].turnNo, clues, "turnNo");
      if(g.turns != null) eq(clues, g.turns, "recorded turns");
      return true;
    });
    check(tag + ": final counts match the recorded result", function(){
      var last = CN.buildTimeline(g).pop();
      if(g.red_found != null) eq(last.counts.R, g.red_found, "red found");
      if(g.blue_found != null) eq(last.counts.B, g.blue_found, "blue found");
      if(g.civilians_hit != null) eq(last.counts.C, g.civilians_hit, "civilians");
      eq(last.counts.A > 0, !!g.assassin_hit, "assassin flag");
      return true;
    });
    check(tag + ": replayed winner matches the recorded winner", function(){
      var last = CN.buildTimeline(g).pop();
      eq(last.over, true, "game reached an end state");
      eq(last.winner, g.winner, "winner");
      return true;
    });
    check(tag + ": every frame narrates itself", function(){
      CN.buildTimeline(g).forEach(function(f, k){
        if(typeof f.commentary !== "string" || !f.commentary.length)
          throw new Error("frame " + k + " has no commentary");
      });
      return true;
    });
  });

  var failed = results.filter(function(r){ return !r.ok; });
  var host = document.getElementById("selftest");
  document.getElementById("app").hidden = true;
  host.hidden = false;
  var html = "<h1>viewer self-test</h1>";
  html += '<div class="summary ' + (failed.length ? "fail" : "pass") + '">' +
          (failed.length ? "FAIL" : "PASS") + " — " +
          (results.length - failed.length) + "/" + results.length +
          " checks over " + games.length + " embedded game(s)</div>";
  results.forEach(function(r){
    html += '<div class="row ' + (r.ok ? "pass" : "fail") + '"><span class="st">' +
            (r.ok ? "PASS" : "FAIL") + "</span><span>" + esc(r.name) +
            (r.detail ? " — " + esc(r.detail) : "") + "</span></div>";
  });
  host.innerHTML = html;
  var summary = (failed.length ? "FAIL" : "PASS") + ": " +
                (results.length - failed.length) + "/" + results.length + " checks";
  if(failed.length){
    console.error("viewer selftest " + summary);
    failed.forEach(function(r){ console.error("  FAIL " + r.name + " " + r.detail); });
  } else {
    console.log("viewer selftest " + summary);
  }
  window.CN_SELFTEST_RESULT = {pass:!failed.length, total:results.length,
                               failed:failed.length, results:results};
}

/* =========================================================================
   App
   ========================================================================= */
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
  });
}
var $ = function(id){ return document.getElementById(id); };

var App = {
  games:[], game:null, frames:[], step:0,
  playing:false, timer:null, speed:1, spy:false
};

function loadGames(list, opts){
  opts = opts || {};
  var added = 0;
  list.forEach(function(g){
    var id = g.id || (g.source || "replay") + "#" + (g.index != null ? g.index : App.games.length);
    if(App.games.some(function(x){ return x.id === id; })) return;
    g.id = id;
    App.games.push(g);
    added++;
  });
  renderGameList();
  if(added && (opts.select || !App.game)){
    selectGame(App.games.length - added);
  }
  return added;
}

function renderGameList(){
  var host = $("gamelist");
  $("gcount").textContent = App.games.length ? App.games.length + " loaded" : "";
  if(!App.games.length){
    host.innerHTML = '<div class="dropzone">No games embedded. Export some with ' +
                     '<span class="mono">python -m harness.export_replay</span> and drop the file in.</div>';
    return;
  }
  host.innerHTML = App.games.map(function(g, i){
    var badgeCls = g.assassin_hit ? "death" : "win-" + g.winner;
    var badge = g.assassin_hit ? "ASSASSIN" : (g.winner === "R" ? "RED" : "BLUE");
    var meta = g.pool + " · seed " + g.seed + " · " + g.turns + " clues" +
               (g.single_team ? " · solo" : "");
    return '<button class="gcard" data-i="' + i + '" aria-current="' +
           (App.game === g ? "true" : "false") + '">' +
           '<div class="lab">' + esc(g.label || CN.matchupLabel(g)) +
           '<span class="badge ' + badgeCls + '">' + badge + '</span></div>' +
           '<div class="sub">' + esc(CN.matchupLabel(g)) + '</div>' +
           '<div class="meta">' + esc(meta) + '</div></button>';
  }).join("");
  Array.prototype.forEach.call(host.querySelectorAll(".gcard"), function(el){
    el.addEventListener("click", function(){ selectGame(+el.dataset.i); });
  });
}

function selectGame(i){
  var g = App.games[i];
  if(!g) return;
  pause();
  App.game = g;
  App.frames = CN.buildTimeline(g);
  App.step = 0;
  renderGameList();
  buildBoard();
  buildLog();
  $("matchup").innerHTML = "<b>" + esc(CN.matchupLabel(g)) + "</b>";
  $("meta").innerHTML = esc(g.pool + " pool · seed " + g.seed) +
                        (g.duration_s ? " · <b>" + g.duration_s + "s</b>" : "");
  $("gamenote").textContent = g.note || "";
  $("ag-R").textContent = CN.sideName(g, "red");
  $("ag-B").textContent = g.single_team ? "(no blue team)" : CN.sideName(g, "blue");
  $("scrub").max = App.frames.length - 1;
  render();
}

function buildBoard(){
  var g = App.game, html = "", i;
  for(i = 0; i < 25; i++){
    html += '<div class="tile hidden k-' + g.key[i] + '" data-i="' + i + '">' +
            '<span class="key-dot key-' + g.key[i] + '"></span>' +
            '<span class="w">' + esc(g.words[i]) + "</span></div>";
  }
  $("board").innerHTML = html;
}

function buildLog(){
  var html = "", i, f;
  for(i = 1; i < App.frames.length; i++){
    f = App.frames[i];
    var mv = App.game.moves[i - 1];
    html += '<div class="line ' + mv.team + " " + f.kind + " " + f.tone +
            '" data-step="' + i + '"><span class="n">' + i + '</span>' +
            '<span class="txt">' + esc(f.commentary) + "</span></div>";
  }
  $("log").innerHTML = html;
  Array.prototype.forEach.call($("log").querySelectorAll(".line"), function(el){
    el.addEventListener("click", function(){ pause(); goTo(+el.dataset.step, true); });
  });
}

function render(animate){
  var g = App.game, f = App.frames[App.step], i;
  if(!g) return;
  var tiles = $("board").children;
  for(i = 0; i < 25; i++){
    var t = tiles[i], col = f.colors[i];
    t.className = "tile k-" + g.key[i] + (col ? " done" : " hidden") +
                  (animate && f.lastIndex === i ? " just" : "");
  }

  // clue bar
  var bar = $("cluebar");
  bar.className = "cluebar" + (f.clue ? " team-" + f.clue.team : "");
  if(f.clue){
    $("clue-who").textContent = CN.teamLabel(f.clue.team) + " clues — " +
      CN.sideName(g, f.clue.team === "R" ? "red" : "blue") + ", turn " + f.turnNo;
    $("clue-word").textContent = f.clue.clue;
    $("clue-num").hidden = false;
    $("clue-num").textContent = f.clue.n;
    $("clue-think").textContent = f.clue.sec != null ? "thought for " + f.clue.sec + "s" : "";
  } else {
    $("clue-who").textContent = "no clue yet";
    $("clue-word").textContent = "—";
    $("clue-num").hidden = true;
    $("clue-think").textContent = "";
  }

  // scoreboard
  ["R", "B"].forEach(function(team){
    $("left-" + team).textContent = CN.wordsLeft(f, team);
    var pips = "", k;
    for(k = 0; k < CN.TARGET[team]; k++)
      pips += '<span class="pip' + (k < f.counts[team] ? " on" : "") + '"></span>';
    $("pips-" + team).innerHTML = pips;
    var active = f.clue && f.clue.team === team && !f.over;
    $("team-" + team).className = "team " + team + (active ? " active" : "");
  });

  // result banner
  var res = $("result");
  if(f.over){
    res.className = "result show " + f.winner;
    res.innerHTML = "<b>" + esc(CN.resultLine(g, f)) + "</b>";
  } else {
    res.className = "result";
    res.innerHTML = "";
  }

  // controls + log cursor
  $("scrub").value = App.step;
  $("stepno").textContent = App.step + " / " + (App.frames.length - 1);
  $("b-prev").disabled = $("b-first").disabled = App.step === 0;
  $("b-next").disabled = $("b-last").disabled = App.step >= App.frames.length - 1;
  // Scroll the log box itself; scrollIntoView would drag the whole page with it.
  var box = $("log");
  Array.prototype.forEach.call(box.children, function(el){
    var on = +el.dataset.step === App.step;
    el.classList.toggle("now", on);
    if(on) box.scrollTop = el.offsetTop - (box.clientHeight - el.offsetHeight) / 2;
  });

  if(animate && f.boom) boom();
}

var boomTimer = null;
function boom(){
  document.body.classList.remove("boom");
  void document.body.offsetWidth;      // restart the animation
  document.body.classList.add("boom");
  clearTimeout(boomTimer);
  boomTimer = setTimeout(function(){ document.body.classList.remove("boom"); }, 1250);
}

function goTo(step, animate){
  if(!App.frames.length) return;
  App.step = Math.max(0, Math.min(App.frames.length - 1, step));
  render(animate);
}
function stepBy(d){ pause(); goTo(App.step + d, d > 0); }

/* Clues linger a beat longer than guesses -- that is the moment you read. */
function delayFor(step){
  var f = App.frames[step];
  if(!f) return 900;
  var base = f.kind === "clue" ? 1500 : (f.boom ? 2200 : 850);
  return base * App.speed;
}
function play(){
  if(App.playing || !App.frames.length) return;
  if(App.step >= App.frames.length - 1) goTo(0, false);
  App.playing = true;
  $("b-play").innerHTML = "&#10073;&#10073;";
  tick();
}
function tick(){
  if(!App.playing) return;
  if(App.step >= App.frames.length - 1){ pause(); return; }
  goTo(App.step + 1, true);
  App.timer = setTimeout(tick, delayFor(App.step));
}
function pause(){
  App.playing = false;
  clearTimeout(App.timer);
  $("b-play").innerHTML = "&#9654;";
}
function togglePlay(){ App.playing ? pause() : play(); }

function setSpy(on){
  App.spy = on;
  document.body.classList.toggle("spy", on);
  $("spybtn").setAttribute("aria-pressed", on ? "true" : "false");
}

function cycleSpeed(d){
  var sel = $("speed");
  sel.selectedIndex = Math.max(0, Math.min(sel.options.length - 1, sel.selectedIndex + d));
  App.speed = parseFloat(sel.value);
}

function shiftGame(d){
  var i = App.games.indexOf(App.game);
  selectGame((i + d + App.games.length) % App.games.length);
}

/* ---------- file loading ---------- */
function ingestText(text, name){
  var payload;
  try{ payload = JSON.parse(text); }
  catch(e){ return flashMsg(name + ": not valid JSON"); }
  var list = CN.normalisePayload(payload);
  if(!list.length){
    if(CN.looksLikeRawArena(payload))
      return flashMsg(name + " is a raw arena result. Run: python -m harness.export_replay " + name);
    return flashMsg(name + ": no replay games in there");
  }
  list.forEach(function(g){ if(!g.source) g.source = name; });
  var added = loadGames(list, {select:true});
  flashMsg(added ? "loaded " + added + " game(s) from " + name
                 : "already loaded " + name);
}
var msgTimer = null;
function flashMsg(text){
  var drop = $("drop");
  drop.dataset.orig = drop.dataset.orig || drop.innerHTML;
  drop.innerHTML = "<b>" + esc(text) + "</b>";
  clearTimeout(msgTimer);
  msgTimer = setTimeout(function(){ drop.innerHTML = drop.dataset.orig; wireDrop(); }, 4500);
}
function readFiles(files){
  Array.prototype.forEach.call(files, function(file){
    var reader = new FileReader();
    reader.onload = function(){ ingestText(String(reader.result), file.name); };
    reader.readAsText(file);
  });
}
function wireDrop(){
  var input = $("file");
  if(input) input.addEventListener("change", function(){ readFiles(input.files); });
}

/* ---------- boot ---------- */
(function init(){
  var payload = window.CN_EMBEDDED || {};
  var games = CN.normalisePayload(payload);

  if(/[?&]selftest=1/.test(location.search)){
    runSelfTest(games);
    return;
  }

  loadGames(games);
  if(!games.length) renderGameList();

  $("b-play").addEventListener("click", togglePlay);
  $("b-next").addEventListener("click", function(){ stepBy(1); });
  $("b-prev").addEventListener("click", function(){ stepBy(-1); });
  $("b-first").addEventListener("click", function(){ pause(); goTo(0, false); });
  $("b-last").addEventListener("click", function(){ pause(); goTo(App.frames.length - 1, false); });
  $("scrub").addEventListener("input", function(){ pause(); goTo(+this.value, false); });
  $("speed").addEventListener("change", function(){ App.speed = parseFloat(this.value); });
  $("spybtn").addEventListener("click", function(){ setSpy(!App.spy); });
  wireDrop();

  ["dragenter", "dragover"].forEach(function(ev){
    document.addEventListener(ev, function(e){
      e.preventDefault(); document.body.classList.add("dragging");
    });
  });
  ["dragleave", "drop"].forEach(function(ev){
    document.addEventListener(ev, function(e){
      if(ev === "dragleave" && e.relatedTarget) return;
      document.body.classList.remove("dragging");
    });
  });
  document.addEventListener("drop", function(e){
    e.preventDefault();
    if(e.dataTransfer && e.dataTransfer.files.length) readFiles(e.dataTransfer.files);
  });

  document.addEventListener("keydown", function(e){
    if(e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) && e.key !== "Escape") return;
    var k = e.key;
    if(k === " "){ e.preventDefault(); togglePlay(); }
    else if(k === "ArrowRight"){ e.preventDefault(); e.shiftKey ? (pause(), goTo(CN.turnJump(App.game, App.step, 1), false)) : stepBy(1); }
    else if(k === "ArrowLeft"){ e.preventDefault(); e.shiftKey ? (pause(), goTo(CN.turnJump(App.game, App.step, -1), false)) : stepBy(-1); }
    else if(k === "Home"){ pause(); goTo(0, false); }
    else if(k === "End"){ pause(); goTo(App.frames.length - 1, false); }
    else if(k === "s" || k === "S"){ setSpy(!App.spy); }
    else if(k === "r" || k === "R"){ pause(); goTo(0, false); }
    else if(k === "j" || k === "J"){ shiftGame(1); }
    else if(k === "k" || k === "K"){ shiftGame(-1); }
    else if(k === "["){ cycleSpeed(-1); }
    else if(k === "]"){ cycleSpeed(1); }
  });
})();
</script>
